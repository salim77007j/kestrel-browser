[package]
name = "kestrel-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kestrel Browser: fast, private, feather-light Windows browser"
default-run = "kestrel-browser"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable", "devtools"] }
serde = { workspace = true }
serde_json = { workspace = true }
kestrel-privacy = { path = "../crates/kestrel-privacy" }
kestrel-data = { path = "../crates/kestrel-data" }
url = "2"
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
flate2 = "1"
open = "5"
rfd = "0.15"
dirs = "6"
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
