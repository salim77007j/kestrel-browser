<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New Tab</title>
    <link rel="stylesheet" href="/src/styles/pages.css" />
  </head>
  <body>
    <div class="newtab">
      <div class="newtab-top">
        <div class="newtab-greet">
          <span class="mark">
            <svg viewBox="0 0 24 24"><path d="M2 20h20L12 4 2 20zm10-2.5L5.6 10h12.8L12 17.5z" fill-opacity="0"/><path d="M2 20h20L12 4 2 20z"/></svg>
          </span>
          <div>
            <div class="greet-title" id="greeting">Good morning!</div>
            <div class="greet-sub">Hope you have a great day.</div>
          </div>
        </div>
        <div class="newtab-status">
          <div class="weather" id="weather" title="Weather at your approximate location">
            <span id="weather-icon">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="#f9ab00"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg>
            </span>
            <span><span class="temp" id="w-temp">--°C</span><div class="cond" id="w-cond">Weather…</div></span>
          </div>
          <div class="clock">
            <div class="time" id="clock-time">--:--</div>
            <div class="date" id="clock-date">--</div>
          </div>
        </div>
      </div>

      <div class="newtab-center">
        <h1>Search the web</h1>
        <div class="sub">Find what you need, when you need it.</div>
        <form class="searchbox" id="searchform">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.49 4.49 0 0 1 9.5 14z"/></svg>
          <input id="q" placeholder="Search Google or type a URL" autocomplete="off" />
          <button type="button" class="lens" id="privacy-quick" title="Privacy dashboard">
            <svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
          </button>
        </form>

        <div class="shortcuts" id="shortcuts"></div>
      </div>

      <div class="newtab-footer">
        <div class="left">
          <span class="leaf">
            <svg viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"/></svg>
            A cleaner, brighter web
          </span>
          <span class="divider"></span>
          <span>Simple. Fast. Yours.</span>
        </div>
        <button class="icon-btn" id="open-settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94 7.07 7.07 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.42h-3.84a.48.48 0 0 0-.48.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.72 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.42.48.42h3.84c.24 0 .44-.18.48-.42l.36-2.54a7.03 7.03 0 0 0 1.62-.94l2.39.96c.23.09.47 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 15.6 12 3.6 3.6 0 0 1 12 15.6z"/></svg>
        </button>
      </div>
    </div>
    <script type="module" src="/src/pages/newtab.ts"></script>
  </body>
</html>
