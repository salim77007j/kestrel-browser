[package]
name = "kestrel-data"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kestrel Browser data layer: settings, history, bookmarks, downloads, session, permissions, vault"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["sync-secret-service"], optional = true }

[features]
default = ["vault"]
# Vault uses the OS secret service (libdbus). Disable with --no-default-features
# on systems without dbus development libraries.
vault = ["dep:keyring"]
