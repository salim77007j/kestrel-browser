[package]
name = "kestrel-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kestrel Browser — fast, private, lightweight (GTK4 + WebKitGTK, Rust core)"

[[bin]]
name = "kestrel"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
webkit = { package = "webkit6", version = "0.6", features = ["v2_44"] }
glib = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
kestrel-privacy = { path = "../kestrel-privacy" }
kestrel-data = { path = "../kestrel-data" }
serde_json = "1"
