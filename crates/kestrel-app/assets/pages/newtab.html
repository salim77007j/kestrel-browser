<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>New Tab — Kestrel</title>
  <link rel="stylesheet" href="kestrel://assets/app.css">
</head>
<body>
  <div class="ntp">
    <div class="logo"><span class="brand-mark">K</span><span>Kestrel <span class="k">Browser</span></span></div>
    <form id="qform">
      <div class="searchwrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="Search or enter address" autofocus autocomplete="off">
        <span class="engine-tag" id="engine-tag">DuckDuckGo</span>
      </div>
    </form>
    <div class="stats" id="shield-summary" style="text-align:left"></div>
    <h2 style="font-size:14px;color:var(--muted);text-align:left">Most visited</h2>
    <div class="dial" id="dial"></div>
    <div class="quick">
      <kbd>Ctrl</kbd>+<kbd>T</kbd> new tab &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>L</kbd> address &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>D</kbd> bookmark &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> private tab
    </div>
  </div>
  <script src="kestrel://assets/app.js"></script>
  <script>
  window.pageRender = function (state, esc) {
    if (!state) return;
    var engines = { duckduckgo: "DuckDuckGo", google: "Google", bing: "Bing", brave: "Brave Search", custom: "Custom" };
    var eng = engines[state.settings.search_engine] || "Search";
    document.getElementById("engine-tag").textContent = eng;

    // shield summary strip
    var sh = state.shield;
    var el = document.getElementById("shield-summary");
    el.innerHTML =
      '<div class="stat" style="min-width:110px"><div class="num">' + (sh.filters_active ? "ON" : "…") + '</div><div class="lbl">Tracking protection</div></div>' +
      '<div class="stat" style="min-width:110px"><div class="num">' + sh.network_rules.toLocaleString() + '</div><div class="lbl">Active filter rules</div></div>' +
      '<div class="stat" style="min-width:110px"><div class="num">' + sh.tracker_hosts.toLocaleString() + '</div><div class="lbl">Tracker domains covered</div></div>';

    // speed dial
    var dial = document.getElementById("dial");
    dial.innerHTML = "";
    var sites = state.top_sites || [];
    var defaults = [
      { url: "https://duckduckgo.com", title: "DuckDuckGo" },
      { url: "https://github.com", title: "GitHub" },
      { url: "https://wikipedia.org", title: "Wikipedia" },
      { url: "https://news.ycombinator.com", title: "Hacker News" }
    ];
    var items = sites.length ? sites : defaults;
    items.slice(0, 8).forEach(function (s) {
      var host = (s.url.match(/^https?:\/\/([^\/]+)/) || [])[1] || s.url;
      var a = document.createElement("a");
      a.href = s.url;
      a.innerHTML = '<span class="favicon">' + esc((s.title || host || "?").charAt(0).toUpperCase()) + '</span>' +
        '<span class="meta" style="min-width:0"><span class="t">' + esc(s.title || host) + '</span><br><span class="s">' + esc(host) + '</span></span>';
      a.addEventListener("click", function (ev) { ev.preventDefault(); __kestrel.send("open-url", { value: s.url }); });
      dial.appendChild(a);
    });
  };

  document.getElementById("qform").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var q = document.getElementById("q").value.trim();
    if (!q) return;
    if (/^https?:\/\//.test(q) || /^[\w-]+(\.[\w-]+)+/.test(q)) {
      __kestrel.send("open-url", { value: q });
    } else {
      __kestrel.send("search", { value: q });
    }
  });
  </script>
</body>
</html>
