<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>History — Kestrel</title>
  <link rel="stylesheet" href="kestrel://assets/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">K</span> Kestrel</div>
    <nav>
      <a href="kestrel://newtab">New Tab</a>
      <a href="kestrel://settings">Settings</a>
      <a href="kestrel://privacy">Privacy Dashboard</a>
      <a href="kestrel://bookmarks">Bookmarks</a>
      <a href="kestrel://history" class="active">History</a>
      <a href="kestrel://downloads">Downloads</a>
    </nav>
  </aside>
  <main class="main">
    <h1>History</h1>
    <p class="sub">Stored locally in SQLite (WAL). Nothing is ever synced.</p>
    <div class="card">
      <div class="right">
        <input type="search" id="q" placeholder="Search history…" style="flex:1">
        <button class="k danger" id="clear">Clear all history</button>
      </div>
    </div>
    <div class="card">
      <ul class="entry-list" id="list"></ul>
    </div>
  </main>
</div>
<script src="kestrel://assets/app.js"></script>
<script>
function fmtDate(ts) {
  var d = new Date(ts * 1000);
  return d.toLocaleDateString() + " " + d.toLocaleTimeString();
}
window.pageRender = function (state) {
  if (!state) return;
  renderList(state.history || []);
};
function renderList(items) {
  var ul = document.getElementById("list");
  ul.innerHTML = "";
  if (!items.length) {
    ul.innerHTML = '<div class="empty">Nothing here yet.</div>';
    return;
  }
  items.forEach(function (h) {
    var li = document.createElement("li");
    li.innerHTML = '<span class="favicon">' + ((h.title || h.url).charAt(0) || "?").toUpperCase() + '</span>' +
      '<span class="meta"><span class="t">' + __kestrel.esc(h.title || h.url) + '</span><span class="s">' + __kestrel.esc(h.url) + '</span></span>' +
      '<span class="s" style="white-space:nowrap">' + fmtDate(h.ts) + '</span>';
    var open = document.createElement("button");
    open.className = "iconbtn"; open.textContent = "↗";
    open.addEventListener("click", function () { __kestrel.send("open-url", { value: h.url }); });
    var del = document.createElement("button");
    del.className = "iconbtn"; del.textContent = "✕";
    del.addEventListener("click", function () { __kestrel.send("remove-history", { id: h.id }); });
    li.appendChild(open); li.appendChild(del);
    ul.appendChild(li);
  });
}
document.getElementById("q").addEventListener("input", function (e) {
  var q = e.target.value.toLowerCase();
  var state = __kestrel.getState();
  var items = (state.history || []).filter(function (h) {
    return (h.title || "").toLowerCase().includes(q) || (h.url || "").toLowerCase().includes(q);
  });
  renderList(items);
});
document.getElementById("clear").addEventListener("click", function () { __kestrel.send("clear-data", { value: "history" }); });
</script>
</body>
</html>
