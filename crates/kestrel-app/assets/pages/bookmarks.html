<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Bookmarks — Kestrel</title>
  <link rel="stylesheet" href="kestrel://assets/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">K</span> Kestrel</div>
    <nav>
      <a href="kestrel://newtab">New Tab</a>
      <a href="kestrel://settings">Settings</a>
      <a href="kestrel://privacy">Privacy Dashboard</a>
      <a href="kestrel://bookmarks" class="active">Bookmarks</a>
      <a href="kestrel://history">History</a>
      <a href="kestrel://downloads">Downloads</a>
    </nav>
  </aside>
  <main class="main">
    <h1>Bookmarks</h1>
    <p class="sub">Saved pages — add more with the star button or <code class="inline">Ctrl+D</code>.</p>
    <div class="card">
      <input type="search" id="q" placeholder="Search bookmarks…" style="width:100%">
    </div>
    <div class="card">
      <ul class="entry-list" id="list"></ul>
    </div>
  </main>
</div>
<script src="kestrel://assets/app.js"></script>
<script>
window.pageRender = function (state) {
  if (!state) return;
  renderList(state.bookmarks || []);
};
function renderList(items) {
  var ul = document.getElementById("list");
  ul.innerHTML = "";
  if (!items.length) {
    ul.innerHTML = '<div class="empty">No bookmarks yet.</div>';
    return;
  }
  items.forEach(function (b) {
    var li = document.createElement("li");
    li.innerHTML = '<span class="favicon">' + ((b.title || b.url).charAt(0) || "?").toUpperCase() + '</span>' +
      '<span class="meta"><span class="t">' + __kestrel.esc(b.title || b.url) + '</span><span class="s">' + __kestrel.esc(b.url) + '</span></span>';
    var open = document.createElement("button");
    open.className = "iconbtn"; open.textContent = "↗";
    open.title = "Open";
    open.addEventListener("click", function () { __kestrel.send("open-url", { value: b.url }); });
    var del = document.createElement("button");
    del.className = "iconbtn"; del.textContent = "✕";
    del.addEventListener("click", function () { __kestrel.send("remove-bookmark", { value: b.url }); });
    li.appendChild(open); li.appendChild(del);
    ul.appendChild(li);
  });
}
document.getElementById("q").addEventListener("input", function (e) {
  var q = e.target.value.toLowerCase();
  var state = __kestrel.getState();
  var items = (state.bookmarks || []).filter(function (b) {
    return (b.title || "").toLowerCase().includes(q) || (b.url || "").toLowerCase().includes(q);
  });
  renderList(items);
});
</script>
</body>
</html>
