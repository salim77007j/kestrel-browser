name: Kestrel CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core (privacy + data) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/kestrel-privacy
            crates/kestrel-data
      - name: cargo test (pure Rust crates)
        run: cargo test -p kestrel-privacy -p kestrel-data

  build-windows:
    name: Windows build (exe + NSIS installer)
    runs-on: windows-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build (vite + tauri)
        run: npm run tauri build

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-windows-portable
          path: target/release/kestrel.exe
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
